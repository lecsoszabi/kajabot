name: Famous heti menü frissítése

on:
  schedule:
    # a Famous mindig hétfőn posztolja a heti menüt, de az időpont ingadozik (megfigyelve: 7-11
    # óra magyar idő között) — hétfőn óránként nézünk rá; ha addig nem jönne ki, kedden és
    # szerdán is (tartalékként), utána viszont leállunk a következő hétig
    - cron: '0 5-14 * * 1-3'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node scripts/scrape-famous.mjs

      - name: Commit, ha változott az adat
        run: |
          git config user.name "kajabot-ci"
          git config user.email "actions@github.com"
          git add data/famous-week.json
          git diff --cached --quiet || git commit -m "Famous heti menü frissítve"
          git push
